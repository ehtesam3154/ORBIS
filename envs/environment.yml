# Evaluation environment: scoring, reseating, reader fitting, preparation of the brain datasets, embryo unfold, ablation helpers.
# These are the versions every reported score and reseated layout was computed with. The reseat CUDA kernels are compiled at run
# time with nvcc 11.8 and g++-11 (set CUDA_HOME, or pass NVCC to scripts/reseat.sh).
name: orbis-eval
channels:
  - conda-forge
  - pytorch
dependencies:
  - python=3.9.25
  - pip
  - pip:
      - numpy==1.23.4
      - scipy==1.9.1
      - pandas==2.0.0
      - scikit-learn==1.6.1
      - threadpoolctl==3.6.0
      - joblib==1.5.3
      - numba==0.60.0
      - llvmlite==0.43.0
      - anndata==0.10.9
      - h5py==3.14.0
      - scanpy==1.10.3
      - harmonypy==2.0.0
      - torch==2.0.0
